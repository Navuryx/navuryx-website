<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Navuryx</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <a href="../" class="brand">Navuryx</a>
    <nav>
      <a href="../">Home</a>
      <a href="../about/">About</a>
      <a href="../team/">Team</a>
      <a href="../projects/">Projects</a>
      <a href="./" class="active">Contact</a>
      <a href="https://paypal.me/hitboyxx23" target="_blank" rel="noopener" class="nav-donate">Donate</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="tagline">Let's Talk</div>
  <p class="lead">Got a project, a question, or just want to say hi? Send us a message.</p>
</div>

<form class="form-card" id="contact-form">
  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your name" required>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required>
  </div>
  <div class="field">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" placeholder="Tell us about your project..." required></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Send Message</button>
  <div class="form-status" id="form-status"></div>
</form>

<div class="content-block">
  <h2>Navuryx</h2>
  <div class="cta-row" style="padding:0 0 32px;max-width:none;">
    <a href="mailto:support@navuryx.com" class="btn">Email Support</a>
    <a href="https://discord.gg/va3CcWtAz5" target="_blank" rel="noopener" class="btn">Navuryx Discord</a>
  </div>

  <h2>HitBoyXx23 (Owner)</h2>
  <div class="cta-row" style="padding:0 0 48px;max-width:none;">
    <a href="mailto:HitBoyXx23@navuryx.com" class="btn">Email</a>
    <a href="https://discord.com/users/1114586353116647444" target="_blank" rel="noopener" class="btn">Discord</a>
    <a href="https://github.com/HitBoyXx23-dev" target="_blank" rel="noopener" class="btn">GitHub</a>
    <a href="https://hitboyxx23.dev" target="_blank" rel="noopener" class="btn">Website</a>
  </div>
</div>

<footer>
  &copy; 2026 Navuryx. All rights reserved.
</footer>

<script src="../js/main.js"></script>
</body>
</html>
