<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Navuryx</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">
  <a href="index.html" class="brand">Navuryx</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="team.html">Team</a>
    <a href="projects.html">Projects</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
    <a href="https://paypal.me/hitboyxx23" target="_blank" rel="noopener">Donate</a>
  </nav>

  <div class="tagline">Let's Talk</div>
  <p class="lead">Have a project in mind, or just want to say hi? Reach out — we'd love to hear from you.</p>
</div>

<form class="form-card" id="contact-form">
  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your name" required>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required>
  </div>
  <div class="field">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" placeholder="Tell us about your project..." required></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Send Message</button>
  <div class="form-status" id="form-status"></div>
</form>

<div class="cta-row">
  <a href="mailto:hitboyzgxc23@gmail.com" class="btn">Email Us Directly</a>
</div>

<footer>
  &copy; 2026 Navuryx. All rights reserved.
</footer>

<script src="js/main.js"></script>
</body>
</html>
